<style>
:root{--gold2:#e8c060;--sky:#5ab0ff;--pale:#d8ecff;--soft:#8ab4d8;--white:#eef6ff;--gold:#c8922a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;background:#010810;color:var(--pale);display:flex;flex-direction:column;}

/* TABS */
.tabs{display:flex;padding:0 16px;gap:6px;flex-shrink:0;padding-top:16px;}
.tab{flex:1;padding:8px 4px;border-radius:10px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:none;cursor:pointer;transition:all .25s;font-family:'DM Sans',sans-serif;font-weight:500;}
.tab.active{background:linear-gradient(135deg,rgba(200,146,42,.25),rgba(138,92,16,.3));color:var(--gold2);border:1px solid rgba(200,146,42,.3);}
.tab.inactive{background:rgba(10,30,62,.4);color:var(--soft);border:1px solid rgba(26,111,212,.1);}

.header{padding:14px 20px 10px;flex-shrink:0;}
.date-line{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin-bottom:3px;}
.day-title{font-family:'Cormorant',serif;font-size:1.7rem;color:var(--white);line-height:1.1;}
.day-title em{font-style:italic;color:var(--sky);}
.progress-bar{height:3px;background:rgba(26,111,212,.12);border-radius:2px;margin-top:10px;}
.progress-fill{height:100%;background:linear-gradient(to right,var(--sky),var(--gold2));border-radius:2px;transition:width .4s cubic-bezier(.23,1,.32,1);}
.progress-text{font-size:.62rem;color:var(--soft);margin-top:4px;letter-spacing:.05em;}

.scroll{flex:1;overflow-y:auto;padding:6px 16px 140px;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{display:none;}

.sec-lbl{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin:14px 0 7px;opacity:.75;}

/* TASKS */
.task{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:12px;margin-bottom:7px;background:rgba(10,30,62,.55);border:1px solid rgba(26,111,212,.1);transition:all .2s;cursor:pointer;user-select:none;}
.task.priority{background:rgba(200,146,42,.06);border-color:rgba(200,146,42,.18);}
.task.done{opacity:.38;}
.task.done .task-name{text-decoration:line-through;}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(26,111,212,.32);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.task.priority .chk{border-color:rgba(200,146,42,.38);}
.task.done .chk{background:rgba(26,111,212,.4);border-color:var(--sky);}
.task.priority.done .chk{background:rgba(200,146,42,.4);border-color:var(--gold2);}
.chk-ico{font-size:.68rem;color:#fff;display:none;}
.task.done .chk-ico{display:block;}
.tb{flex:1;min-width:0;}
.task-name{font-size:.85rem;color:var(--pale);font-weight:400;line-height:1.3;margin-bottom:2px;}
.task-detail{font-size:.72rem;color:var(--soft);line-height:1.4;font-weight:300;}
.bdg{font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:20px;flex-shrink:0;margin-top:2px;align-self:flex-start;}
.bc{background:rgba(26,111,212,.15);color:var(--sky);border:1px solid rgba(26,111,212,.22);}
.be{background:rgba(90,176,255,.08);color:#7ec8ff;border:1px solid rgba(90,176,255,.15);}
.bs{background:rgba(200,146,42,.1);color:var(--gold2);border:1px solid rgba(200,146,42,.18);}
.br{background:rgba(255,180,80,.1);color:#ffb450;border:1px solid rgba(255,180,80,.18);}
.bv{background:rgba(120,200,120,.08);color:#90d890;border:1px solid rgba(120,200,120,.18);}

/* TIPS TAB */
.tip-card{background:linear-gradient(160deg,rgba(10,30,62,.9),rgba(4,14,34,.95));border:1px solid rgba(26,111,212,.15);border-radius:14px;padding:16px;margin-bottom:10px;}
.tip-card.gold{border-color:rgba(200,146,42,.22);background:rgba(8,24,56,.9);}
.tip-cat{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-bottom:6px;}
.tip-title{font-family:'Cormorant',serif;font-size:1.05rem;color:var(--white);margin-bottom:6px;line-height:1.3;}
.tip-body{font-size:.78rem;color:var(--soft);line-height:1.6;}
.tip-body strong{color:var(--pale);}
.tip-link{font-size:.72rem;color:var(--sky);margin-top:6px;display:block;text-decoration:none;}

/* WOOLY */
#wooly-area{position:fixed;bottom:0;left:0;right:0;padding:10px 18px 22px;background:linear-gradient(to top,#010810 65%,transparent);display:flex;align-items:flex-end;gap:10px;pointer-events:none;}
#wooly-svg{width:80px;height:80px;flex-shrink:0;cursor:pointer;pointer-events:all;filter:drop-shadow(0 4px 16px rgba(90,176,255,.25));animation:wb 2.4s ease-in-out infinite;transform-origin:center bottom;}
#wooly-svg:active{transform:scale(.9);}
#wbubble{background:linear-gradient(160deg,rgba(8,28,68,.98),rgba(3,12,34,.99));border:1px solid rgba(200,146,42,.28);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:.8rem;color:var(--pale);line-height:1.55;max-width:230px;pointer-events:all;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;font-family:'Cormorant',serif;font-style:italic;}
#wbubble.show{opacity:1;transform:translateY(0);}
@keyframes wb{0%,100%{transform:translateY(0) rotate(-2deg);}40%{transform:translateY(-9px) rotate(2deg);}70%{transform:translateY(-3px) rotate(-1deg);}}

#bgCanvas{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.45;}
</style>
</head>

  const d = SCHEDULE[dow];
  document.getElementById('dateLine').textContent = DAYS[dow]+' '+today.getDate()+' '+MONTHS[today.getMonth()]+' '+today.getFullYear();
  document.getElementById('dayTitle').innerHTML = d.title+' — <em>'+d.sub+'</em>';

  const list = document.getElementById('tasksView');
  list.innerHTML = '';
  const pri = d.tasks.filter(t=>t.p);
  const reg = d.tasks.filter(t=>!t.p);
  if(pri.length){addLbl(list,'⚡ Priorité absolue');pri.forEach(t=>list.appendChild(mkTask(t)));}
  if(reg.length){addLbl(list,'✦ À faire aujourd\'hui');reg.forEach(t=>list.appendChild(mkTask(t)));}
  updateProg();

  // Tips
  const tv = document.getElementById('tipsView');
  tv.innerHTML = '';
  addLbl(tv,'💡 Conseils & bonnes pratiques');
  TIPS.forEach(tip=>{
    const c = document.createElement('div');
    c.className = 'tip-card'+(tip.gold?' gold':'');
    c.innerHTML = '<div class="tip-cat">'+tip.cat+'</div><div class="tip-title">'+tip.title+'</div><div class="tip-body">'+tip.body+'</div>';
    tv.appendChild(c);
  });

  setTimeout(()=>{
    showWooly("Hello ! Voici ton planning du "+DAYS[dow]+" 🐑 Clique sur moi pour de l'encouragement ✦");
    setTimeout(hideWooly,4500);
  },1500);
}

function addLbl(parent,txt){const d=document.createElement('div');d.className='sec-lbl';d.textContent=txt;parent.appendChild(d);}

function mkTask(t){
  const div=document.createElement('div');
  div.className='task'+(t.p?' priority':'')+(checked[t.id]?' done':'');
  div.innerHTML=`<div class="chk"><span class="chk-ico">✓</span></div><div class="tb"><div class="task-name">${t.name}</div><div class="task-detail">${t.detail}</div></div><span class="bdg ${t.bdg}">${t.lbl}</span>`;
  div.addEventListener('click',()=>toggleTask(t.id,div));
  return div;
}

function toggleTask(id,el){
  checked[id]=!checked[id];
  localStorage.setItem(key,JSON.stringify(checked));
  el.classList.toggle('done',checked[id]);
  updateProg();
  if(checked[id]){
    const total=SCHEDULE[dow].tasks.length;
    const done=SCHEDULE[dow].tasks.filter(t=>checked[t.id]).length;
    if(done===total) setTimeout(()=>showWooly(WOOLY_DONE[Math.floor(Math.random()*WOOLY_DONE.length)]),300);
  }
}

function updateProg(){
  const total=SCHEDULE[dow].tasks.length;
  const done=SCHEDULE[dow].tasks.filter(t=>checked[t.id]).length;
  const pct=total?Math.round((done/total)*100):0;
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pText').textContent=done+' / '+total+' tâches · '+pct+'%';
}

function showWooly(msg){if(woolyTimer)clearTimeout(woolyTimer);const b=document.getElementById('wbubble');b.textContent=msg;b.classList.add('show');}
function hideWooly(){document.getElementById('wbubble').classList.remove('show');}
function woolyTap(){
  if(woolyTimer)clearTimeout(woolyTimer);
  const total=SCHEDULE[dow].tasks.length;
  const done=SCHEDULE[dow].tasks.filter(t=>checked[t.id]).length;
  const msg=done===total&&total>0?WOOLY_DONE[Math.floor(Math.random()*WOOLY_DONE.length)]:WOOLY_MSGS[woolyIdx++%WOOLY_MSGS.length];
  showWooly(msg);
  woolyTimer=setTimeout(hideWooly,5000);
}

(function(){
  const bg=document.getElementById('bgCanvas');const bx=bg.getContext('2d');let W,H,stars=[];
  function resize(){W=bg.width=window.innerWidth;H=bg.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  function rnd(a,b){return a+Math.random()*(b-a);}
  for(let i=0;i<120;i++)stars.push({x:rnd(0,1),y:rnd(0,1),r:rnd(.2,1.1),o:rnd(.1,.5),s:rnd(.1,.4),blue:Math.random()<.3});
  function loop(){bx.clearRect(0,0,W,H);const t=Date.now()*.001;stars.forEach(s=>{const op=Math.max(.03,Math.min(.5,s.o+Math.sin(t*s.s)*.1));bx.beginPath();bx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);bx.fillStyle=s.blue?`rgba(90,176,255,${op})`:`rgba(215,232,255,${op})`;bx.fill();});requestAnimationFrame(loop);}
  loop();
})();

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
